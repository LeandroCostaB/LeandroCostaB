<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#1b2347"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow)"/>

  <!-- code brackets -->
  <text x="1140" y="200" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="150" font-weight="700" fill="url(#accent)" fill-opacity="0.18">&lt;/&gt;</text>

  <!-- name -->
  <text x="70" y="128" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#e6edf3">Leandro Costa Boscariol</text>
  <rect x="72" y="148" width="120" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- role -->
  <text x="70" y="196" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#9da7b3">Analista de Suporte Pleno · Estudante de Engenharia de Software</text>

  <!-- tags -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#c9d1d9">
    <rect x="70" y="222" width="92" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#58a6ff" stroke-opacity="0.5"/>
    <text x="116" y="245" text-anchor="middle">.NET</text>
    <rect x="174" y="222" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#58a6ff" stroke-opacity="0.5"/>
    <text x="230" y="245" text-anchor="middle">Next.js</text>
    <rect x="298" y="222" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#7d8cf9" stroke-opacity="0.5"/>
    <text x="354" y="245" text-anchor="middle">Flutter</text>
    <rect x="422" y="222" width="76" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#a371f7" stroke-opacity="0.5"/>
    <text x="460" y="245" text-anchor="middle">SQL</text>
  </g>

  <text x="1130" y="268" text-anchor="end" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#6e7681">Toledo – PR</text>
</svg>
